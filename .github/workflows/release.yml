name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test tests/VoicemeeterHub.Tests/VoicemeeterHub.Tests.csproj -c Release -p:EnableWindowsTargeting=true

      # Cross-publish a self-contained single-file win-x64 executable from the Linux runner.
      - name: Publish (win-x64, self-contained)
        run: >
          dotnet publish src/VoicemeeterHub/VoicemeeterHub.csproj
          -c Release
          -r win-x64
          -f net8.0-windows
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableWindowsTargeting=true
          -p:Version=${{ steps.version.outputs.value }}
          -o dist/hub

      - name: Package
        run: |
          cd dist/hub
          zip -r "../voicemeeter-hub-${GITHUB_REF_NAME}-win-x64.zip" . -x '*.pdb'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/voicemeeter-hub-*-win-x64.zip
          generate_release_notes: true
